title: nwcommands
description: >-
  Network analysis for Stata — import, generate, analyze, model, and
  visualize network data, with statistical network models (ERGM, SAOM,
  DyNAM, relational event models) built in.
url: "https://nwcommands.org"
baseurl: ""

theme: just-the-docs

color_scheme: light
search_enabled: true
heading_anchors: true

aux_links:
  "nwcommands on GitHub":
    - "https://github.com/thomas-u-grund/nwcommands"
  "Request a feature":
    - "https://github.com/thomas-u-grund/nwcommands/issues/new?template=feature_request.yml"

footer_content: >-
  nwcommands is free to install and use, including for commercial research.
  See the <a href="https://github.com/thomas-u-grund/nwcommands">GitHub
  repository</a> for source, license, and issue tracking.

back_to_top: true
back_to_top_text: "Back to top"

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: red

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

exclude:
  - Gemfile
  - Gemfile.lock
  - tools/
  - vendor/
  - README.md
