name: Deploy documentation site

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-site.yml"
      # the starter package copied to https://nwcommands.org/net/ (tools/make_net_dir.sh)
      - "stata.toc"
      - "nwcommands.pkg"
      - "nwinstall.ado"
      - "nwinstall_models.ado"
      - "nwinstall_buildplugin.ado"
      - "nwinstall_buildmata.ado"
      - "native/**"
      - "nwversion.ado"
      - "nwinstall.sthlp"
      - "nwversion.sthlp"
      - "nwcommands.sthlp"
      - "nwintro.sthlp"
      - "nwstart.sthlp"
      - "tools/make_net_dir.sh"
      # the example data sets, served at https://nwcommands.org/examples/ (nwwebuse's default source since 3.18.1)
      - "data/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: website

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        working-directory: website
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      # AFTER the build: Jekyll would drop underscore files and process the others. Short install address
      # net install nwcommands, from(https://nwcommands.org/net/) replace
      - name: Copy the starter package to net/
        run: bash tools/make_net_dir.sh website/_site/net

      # The old install address (net from http://www.nwcommands.org/main) still appears in old instructions and papers:
      # serve the same starter package there, so that those commands reach the current installer
      - name: Copy the starter package to main/ (old address)
        run: bash tools/make_net_dir.sh website/_site/main

      # The example data sets for nwwebuse and the import examples: short addresses such as
      # https://nwcommands.org/examples/lazega.nwdta (GitHub main stays the fallback)
      - name: Copy the example data to examples/
        run: mkdir -p website/_site/examples && cp -p data/* website/_site/examples/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/_site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
