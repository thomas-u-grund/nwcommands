name: Build native ERGM plugins

# Harmonisation unit 87 (phase C, cross-platform native builds -
# docs/CERTIFICATION.md). No Windows/Linux toolchain or cross-compiler was
# available in the environment this workflow was authored in, so those two
# platforms' own plugin binaries are built here, on GitHub's own hosted
# runners, rather than locally. macOS is rebuilt here too, purely as a
# cross-check against the copy already committed via native/Makefile's own
# `macos` target on a real Apple Silicon development machine.
#
# On a push to the repository's default branch that touches native/, the
# freshly-built plugins are committed back into lib/plugins/ (the exact
# path unw_ergm.do's own ErgmNativePluginPath()/ErgmNativePluginFilename()
# already look for) so the package ships pre-built binaries for all three
# platforms - nwergm's own ErgmNativeAvailable() falls back to the pure
# Mata backend gracefully wherever a given platform's binary is absent, so
# this workflow failing or being skipped never breaks the package, only
# leaves that platform unaccelerated.

on:
  push:
    branches: [main, master]
    paths:
      - "native/**"
      - ".github/workflows/build-plugins.yml"
  pull_request:
    paths:
      - "native/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS plugin
        run: |
          cd native
          make macos
      - uses: actions/upload-artifact@v4
        with:
          name: ergm_mcmc-macos
          path: lib/plugins/macos/ergm_mcmc.plugin

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows plugin (cl /LD)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64 || call "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvarsall.bat" x64
          mkdir lib\plugins\windows
          cd native
          cl /LD /DSYSTEM=STWIN32 /I spi ergm_mcmc.c spi\stplugin.c /Fe:..\lib\plugins\windows\ergm_mcmc.plugin
      - uses: actions/upload-artifact@v4
        with:
          name: ergm_mcmc-windows
          path: lib/plugins/windows/ergm_mcmc.plugin

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux plugin
        run: |
          cd native
          make unix
      - uses: actions/upload-artifact@v4
        with:
          name: ergm_mcmc-linux
          path: lib/plugins/unix/ergm_mcmc_unix.plugin

  commit-binaries:
    needs: [macos, windows, linux]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ergm_mcmc-macos
          path: lib/plugins/macos/
      - uses: actions/download-artifact@v4
        with:
          name: ergm_mcmc-linux
          path: lib/plugins/unix/
      - uses: actions/download-artifact@v4
        with:
          name: ergm_mcmc-windows
          path: lib/plugins/windows/
      - name: Commit rebuilt plugins
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/plugins/
          git diff --cached --quiet || git commit -m "ci: rebuild native ERGM plugins [skip ci]"
          git push
