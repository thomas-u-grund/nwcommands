name: Build native plugins

# Harmonisation unit 87 (phase C, cross-platform native builds -
# docs/CERTIFICATION.md), extended in unit 95 to also build nwgraph.c
# (docs/NATIVE_GRAPH_LIBRARIES.md's own native graph-algorithm kernel -
# currently betweenness centrality), again (2026-08-29) to also build
# saom_sim.c (nwsaom's own native ministep-simulation kernel), and again
# (2026-09-02) to also build dynam_sim.c (nwdynam's own native
# log-likelihood/gradient kernel - see docs/DYNAM_ROADMAP.md and
# dynam_sim.c's own header; unlike saom_sim.c/ergm_mcmc.c, this plugin
# does not run a full sampling/simulation loop in C - it accelerates
# only the hot inner evaluation Mata's own optimize() calls repeatedly,
# the optimizer itself stays in Mata). Each addition was already a
# dependency of native/Makefile's own `macos`/`unix` targets, so
# macOS/Linux were silently already BUILDING it and just never
# uploading/committing it; Windows never even compiled it. No Windows/Linux
# toolchain or
# cross-compiler was available in the environment this workflow was
# authored in, so those two platforms' own plugin binaries are built here,
# on GitHub's own hosted runners, rather than locally. macOS is rebuilt
# here too, purely as a cross-check against the copy already committed via
# native/Makefile's own `macos` target (which builds every plugin, not
# just one) on a real Apple Silicon development machine.
#
# On a push to the repository's default branch that touches native/, the
# freshly-built plugins are committed back into lib/plugins/ (the exact
# paths unw_ergm.do's own ErgmNativePluginPath() and unw_core.do's own
# NativeGraphPluginPath() already look for) so the package ships pre-built
# binaries for all three platforms - both dispatchers fall back to their
# own pure Mata implementation gracefully wherever a given platform's
# binary is absent, so this workflow failing or being skipped never breaks
# the package, only leaves that platform unaccelerated.

on:
  push:
    # BUGFIX: this used to be [main, master] only - this project's own
    # actual active branch is `develop` (see README.md's own "Active
    # development branch" note; `master` is a stale pre-modernization
    # snapshot), so every push that would have triggered this workflow
    # never did - confirmed directly (`gh run list` showed zero runs
    # ever, despite native/*.c having changed across many commits on
    # develop since this workflow was added).
    branches: [develop, main, master]
    paths:
      - "native/**"
      - ".github/workflows/build-plugins.yml"
  pull_request:
    paths:
      - "native/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS plugins
        run: |
          cd native
          make macos
      - name: Build nwedit_viewer (chromeless interactive-view launcher)
        run: |
          mkdir -p lib/plugins/macos
          clang++ -fobjc-arc -O2 -framework Cocoa -framework WebKit \
            -o lib/plugins/macos/nwedit_viewer native/nwedit_viewer.mm
      - uses: actions/upload-artifact@v4
        with:
          name: plugins-macos
          path: |
            lib/plugins/macos/ergm_mcmc.plugin
            lib/plugins/macos/nwgraph.plugin
            lib/plugins/macos/saom_sim.plugin
            lib/plugins/macos/dynam_sim.plugin
            lib/plugins/macos/nwedit_viewer

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # BUGFIX: this used to hardcode two specific vcvarsall.bat paths
      # (Enterprise/Community) and call them directly - neither exists
      # on the actual windows-latest hosted runner ("the system cannot
      # find the path specified" / "'cl' is not recognized", confirmed
      # directly from this workflow's own first real run, unit 87's own
      # authoring environment having had no Windows runner to verify
      # against at all). ilammy/msvc-dev-cmd is the standard, widely-used
      # GitHub Action for this exact problem - it locates whatever MSVC
      # installation the runner actually has and sets up the environment
      # for every subsequent step, rather than guessing a fixed path.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build Windows plugins (cl /LD)
        shell: cmd
        run: |
          mkdir lib\plugins\windows
          cd native
          cl /LD /DSYSTEM=STWIN32 /I spi ergm_mcmc.c spi\stplugin.c /Fe:..\lib\plugins\windows\ergm_mcmc.plugin
          cl /LD /DSYSTEM=STWIN32 /I spi nwgraph.c spi\stplugin.c /Fe:..\lib\plugins\windows\nwgraph.plugin
          cl /LD /DSYSTEM=STWIN32 /I spi saom_sim.c spi\stplugin.c /Fe:..\lib\plugins\windows\saom_sim.plugin
          cl /LD /DSYSTEM=STWIN32 /I spi dynam_sim.c spi\stplugin.c /Fe:..\lib\plugins\windows\dynam_sim.plugin
      - name: Fetch WebView2 SDK + WIL headers (nwedit_viewer dependency)
        shell: cmd
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.2592.51 -OutputDirectory packages
          nuget install Microsoft.Windows.ImplementationLibrary -Version 1.0.240122.1 -OutputDirectory packages
      - name: Build nwedit_viewer (chromeless interactive-view launcher)
        shell: cmd
        run: |
          cl /EHsc /DUNICODE /D_UNICODE ^
            /I packages\Microsoft.Web.WebView2.1.0.2592.51\build\native\include ^
            /I packages\Microsoft.Windows.ImplementationLibrary.1.0.240122.1\include ^
            native\nwedit_viewer_win.cpp ^
            /link /LIBPATH:packages\Microsoft.Web.WebView2.1.0.2592.51\build\native\x64 ^
            WebView2LoaderStatic.lib shlwapi.lib user32.lib ole32.lib shell32.lib advapi32.lib ^
            /Fe:lib\plugins\windows\nwedit_viewer.exe
      - uses: actions/upload-artifact@v4
        with:
          name: plugins-windows
          path: |
            lib/plugins/windows/ergm_mcmc.plugin
            lib/plugins/windows/nwedit_viewer.exe
            lib/plugins/windows/nwgraph.plugin
            lib/plugins/windows/saom_sim.plugin
            lib/plugins/windows/dynam_sim.plugin

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux plugins
        run: |
          cd native
          make unix
      - name: Install WebKitGTK dev headers (nwedit_viewer dependency)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build nwedit_viewer (chromeless interactive-view launcher)
        run: |
          mkdir -p lib/plugins/unix
          gcc -O2 native/nwedit_viewer_linux.c -o lib/plugins/unix/nwedit_viewer \
            $(pkg-config --cflags --libs gtk+-3.0 webkit2gtk-4.1)
      - uses: actions/upload-artifact@v4
        with:
          name: plugins-linux
          path: |
            lib/plugins/unix/ergm_mcmc_unix.plugin
            lib/plugins/unix/nwgraph_unix.plugin
            lib/plugins/unix/saom_sim_unix.plugin
            lib/plugins/unix/dynam_sim_unix.plugin
            lib/plugins/unix/nwedit_viewer

  commit-binaries:
    needs: [macos, windows, linux]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plugins-macos
          path: lib/plugins/macos/
      - uses: actions/download-artifact@v4
        with:
          name: plugins-linux
          path: lib/plugins/unix/
      - uses: actions/download-artifact@v4
        with:
          name: plugins-windows
          path: lib/plugins/windows/
      - name: Commit rebuilt plugins
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/plugins/
          git diff --cached --quiet || git commit -m "ci: rebuild native plugins [skip ci]"
          git push
