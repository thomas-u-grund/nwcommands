name: Build native plugins

# Builds the core package's native plugins (nwgraph) and the nwedit_viewer
# launcher on macOS, Windows and Linux. On a push to the default branch that
# touches native/, the freshly built binaries are committed back into
# lib/plugins/ under per-platform-suffixed filenames. The model packages
# (nwergm, nwsaom, nwdynam, nwrem) have their own repositories and workflows.

on:
  push:
    # BUGFIX: this used to be [main, master] only - this project's own
    # actual active branch is `develop` (see README.md's own "Active
    # development branch" note; `master` is a stale pre-modernization
    # snapshot), so every push that would have triggered this workflow
    # never did - confirmed directly (`gh run list` showed zero runs
    # ever, despite native/*.c having changed across many commits on
    # develop since this workflow was added).
    branches: [develop, main, master]
    # The rebuilt binaries are committed back on develop only; main and master receive them by merge/sync.
    paths:
      - "native/**"
      - ".github/workflows/build-plugins.yml"
  pull_request:
    paths:
      - "native/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS plugins
        run: |
          cd native
          make macos
      - name: Build nwedit_viewer (chromeless interactive-view launcher)
        run: |
          mkdir -p lib/plugins/macos
          clang++ -fobjc-arc -O2 -framework Cocoa -framework WebKit \
            -o lib/plugins/macos/nwedit_viewer_macos native/nwedit_viewer.mm
      - uses: actions/upload-artifact@v4
        with:
          name: plugins-macos
          path: |
            lib/plugins/macos/nwgraph_macos.plugin
            lib/plugins/macos/nwedit_viewer_macos

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # BUGFIX: this used to hardcode two specific vcvarsall.bat paths
      # (Enterprise/Community) and call them directly - neither exists
      # on the actual windows-latest hosted runner ("the system cannot
      # find the path specified" / "'cl' is not recognized", confirmed
      # directly from this workflow's own first real run, unit 87's own
      # authoring environment having had no Windows runner to verify
      # against at all). ilammy/msvc-dev-cmd is the standard, widely-used
      # GitHub Action for this exact problem - it locates whatever MSVC
      # installation the runner actually has and sets up the environment
      # for every subsequent step, rather than guessing a fixed path.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build Windows plugins (cl /LD)
        shell: cmd
        run: |
          mkdir lib\plugins\windows
          cd native
          cl /LD /O2 /DSYSTEM=STWIN32 /I spi nwgraph.c spi\stplugin.c /Fe:..\lib\plugins\windows\nwgraph_windows.plugin
      - name: Fetch WebView2 SDK + WIL headers (nwedit_viewer dependency)
        shell: cmd
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.2592.51 -OutputDirectory packages
          nuget install Microsoft.Windows.ImplementationLibrary -Version 1.0.240122.1 -OutputDirectory packages
      - name: Build nwedit_viewer (chromeless interactive-view launcher)
        shell: cmd
        run: |
          rem BUGFIX (2026-09-02): /Fe: is a cl.exe compiler-driver flag, not
          rem a link.exe flag - once /link appears on the command line,
          rem everything after it is passed straight to link.exe verbatim,
          rem which does not understand /Fe: (its own equivalent is /OUT:)
          rem and silently ignores it. That left /Fe: previously placed
          rem AFTER /link with no effect at all: the linker fell back to
          rem its own default output name (nwedit_viewer_win.exe, next to
          rem the .obj, in native/) instead of writing to
          rem lib\plugins\windows\nwedit_viewer_windows.exe - so the file
          rem this job's own upload-artifact step looked for never
          rem existed, silently (no error at any step; confirmed directly
          rem by inspecting a real run's own linker command echo, which
          rem showed "/out:nwedit_viewer_win.exe", not the intended path).
          rem /Fe: must come BEFORE /link to be interpreted by cl.exe
          rem itself.
          cl /EHsc /DUNICODE /D_UNICODE ^
            /Fe:lib\plugins\windows\nwedit_viewer_windows.exe ^
            /I packages\Microsoft.Web.WebView2.1.0.2592.51\build\native\include ^
            /I packages\Microsoft.Windows.ImplementationLibrary.1.0.240122.1\include ^
            native\nwedit_viewer_win.cpp ^
            /link /LIBPATH:packages\Microsoft.Web.WebView2.1.0.2592.51\build\native\x64 ^
            WebView2LoaderStatic.lib shlwapi.lib user32.lib ole32.lib shell32.lib advapi32.lib
      - uses: actions/upload-artifact@v4
        with:
          name: plugins-windows
          path: |
            lib/plugins/windows/nwedit_viewer_windows.exe
            lib/plugins/windows/nwgraph_windows.plugin

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux plugins
        run: |
          cd native
          make unix
      - name: Install WebKitGTK dev headers (nwedit_viewer dependency)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build nwedit_viewer (chromeless interactive-view launcher)
        run: |
          mkdir -p lib/plugins/unix
          gcc -O2 native/nwedit_viewer_linux.c -o lib/plugins/unix/nwedit_viewer_unix \
            $(pkg-config --cflags --libs gtk+-3.0 webkit2gtk-4.1)
      - uses: actions/upload-artifact@v4
        with:
          name: plugins-linux
          path: |
            lib/plugins/unix/nwgraph_unix.plugin
            lib/plugins/unix/nwedit_viewer_unix

  commit-binaries:
    needs: [macos, windows, linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plugins-macos
          path: lib/plugins/macos/
      - uses: actions/download-artifact@v4
        with:
          name: plugins-linux
          path: lib/plugins/unix/
      - uses: actions/download-artifact@v4
        with:
          name: plugins-windows
          path: lib/plugins/windows/
      - name: Commit rebuilt plugins
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/plugins/
          git diff --cached --quiet || git commit -m "ci: rebuild native plugins [skip ci]"
          git push
